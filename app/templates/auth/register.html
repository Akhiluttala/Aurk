{% extends 'base.html' %}{% block title %}Create account &mdash; AR Drips{% endblock %}{% block content %}<section class="form-card"><h1>Create account</h1>{% if next_url == '/checkout' %}<p>Your bag will be waiting when you sign in.</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>First name<input name="first_name" autocomplete="given-name" required value="{{ request.form.get('first_name','') }}"></label><label>Last name<input name="last_name" autocomplete="family-name" required value="{{ request.form.get('last_name','') }}"></label><label>Email<input type="email" name="email" autocomplete="email" required value="{{ request.form.get('email','') }}"></label><label>Password (12+ characters)<input type="password" name="password" autocomplete="new-password" required minlength="12"></label><p>Read our <a href="{{ url_for('main.privacy') }}">privacy policy</a> and <a href="{{ url_for('main.terms') }}">terms</a>.</p><button class="button">Create account</button></form><p>Already registered? <a href="{{ url_for('auth.login', next=next_url) }}">Sign in</a></p></section>{% endblock %}
