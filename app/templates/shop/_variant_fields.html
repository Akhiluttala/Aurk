<div class="variant-fields" data-variant-fields>
<label data-combined-label>Size / colour<select name="variant_id" required>{% set available = namespace(count=0) %}<option value="">Choose an option</option>{% for variant in product.variants %}{% if variant.is_active %}{% set stock = [variant.inventory.quantity - variant.inventory.reserved_quantity,0]|max if variant.inventory else 0 %}{% set price = variant.price_override if variant.price_override is not none else product.current_price %}<option value="{{ variant.id }}" data-size-id="{{ variant.size_id }}" data-colour-id="{{ variant.color_id }}" data-size="{{ variant.size.name if variant.size else 'One size' }}" data-colour="{{ variant.color.name if variant.color else 'Default' }}" data-stock="{{ [stock,99]|min }}" data-price="{{ '%.2f'|format(price) }}" {% if stock == 0 %}disabled{% endif %}>{{ variant.size.name if variant.size else 'One size' }} / {{ variant.color.name if variant.color else 'Default' }}{{ ' (Sold out)' if stock == 0 else '' }}</option>{% endif %}{% endfor %}</select></label>
<div class="separate-variant-fields" data-separate-fields hidden><label>Colour<select data-colour-select aria-label="Colour for {{ product.name }}"></select></label><label>Size<select data-size-select aria-label="Size for {{ product.name }}"></select></label></div>
</div>
