<article class="home-product-card"><a href="{{ url_for('products.detail', slug=product.slug) }}" class="home-product-image">{% if product.primary_image %}<img src="{{ url_for('products.product_image', image_id=product.primary_image.id) }}" alt="{{ product.name }}" loading="lazy">{% else %}<span class="home-image-empty">AURK<small>Explore this style</small></span>{% endif %}</a><div class="home-product-meta"><p>{{ product.category.name if product.category else 'AURK' }}</p><h3><a href="{{ url_for('products.detail', slug=product.slug) }}">{{ product.name }}</a></h3><span>{{ 'From ' if product.storefront_price_varies else '' }}&#8377;{{ '%.2f'|format(product.storefront_price) }}</span>{% include 'shop/_quick_add.html' %}</div></article>
